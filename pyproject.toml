[project]
name = "anchor-tasking-management-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pablo Martínez Prado", email = "pablo.martinezprado@outlook.es" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.14.0",
